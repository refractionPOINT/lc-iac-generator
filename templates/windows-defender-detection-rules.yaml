# This template contains D&R rules for many common Defender event IDs. 
# NOTE: This relies on collection of the following WEL pattern, which can be specified on the "Artifact Collection" page:
# wel://Microsoft-Windows-Windows Defender/Operational:*
version: 3
hives:
    dr-general:
        Windows Defender Malware Detected:
            data:
                detect:
                    event: WEL
                    op: and
                    rules:
                        - op: is
                          path: event/EVENT/System/Channel
                          value: Microsoft-Windows-Windows Defender/Operational
                        - op: is
                          path: event/EVENT/System/EventID
                          value: "1006"
                respond:
                    - action: report
                      name: Windows Defender Malware Detected
            usr_mtd:
                enabled: true
                expiry: 0
                tags: []
                comment: "Detects malware events reported by Windows Defender."
